<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>__PAGE_TITLE__</title>
<style>
:root{color-scheme:light;--ink:#172b35;--muted:#52656c;--line:#d6e1e1;--paper:#f3f7f5;--accent:#006b5e;--planned:#816117;--implemented:#175e99;--verified:#087354;--unknown:#675775}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}main{max-width:1440px;margin:auto;padding:36px 28px 60px}header{padding:0 0 20px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;color:var(--accent)}h1{font-size:clamp(26px,4vw,40px);line-height:1.25;margin:8px 0 12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}.muted{color:var(--muted)}.meta{font-size:13px;color:var(--muted)}.notice{background:#e7f1ed;border-left:3px solid var(--accent);padding:12px 16px;margin:18px 0}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.badge{display:inline-block;padding:3px 10px;border:1px solid currentColor;border-radius:20px;font-size:12px;font-weight:700}.planned{color:var(--planned)}.implemented{color:var(--implemented)}.verified{color:var(--verified)}.unknown{color:var(--unknown)}button{font:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #b97a00;outline-offset:4px}#tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}#tabs button,.controls button{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--ink)}#tabs button[aria-pressed="true"]{background:var(--accent);color:white;border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.graph-scroll{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fafcfb;margin-top:16px}#graph{display:block;max-width:none}.node rect{fill:white;stroke:var(--line);stroke-width:2}.node{cursor:pointer}.node.selected rect{stroke:var(--accent);stroke-width:3}.node text{font-size:13px;fill:var(--ink);font-weight:650}.node .sub{font-size:11px;fill:var(--muted);font-weight:400}.edge{fill:none;stroke:#738991;stroke-width:1.8}.edge-label{fill:#435b64;font-size:11px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.detail-section{margin-top:15px}.detail-section h3{font-size:13px;color:var(--muted)}ul,ol{padding-left:22px;margin:8px 0}li{overflow-wrap:anywhere}.source{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;white-space:pre-wrap}.stack{display:grid;gap:16px;margin-top:20px}.check,.decision{padding:14px 0;border-top:1px solid var(--line)}.check:first-of-type,.decision:first-of-type{border-top:0}.edge-detail{margin:10px 0;padding:10px;background:var(--paper);border-radius:6px}details summary{cursor:pointer;font-weight:650}footer{margin-top:28px;font-size:12px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}main{padding:22px 14px}.panel{padding:16px}}@media print{main{max-width:none;padding:0}#tabs,.controls{display:none}.layout{display:block}.panel{break-inside:avoid;margin-bottom:16px}.graph-scroll{overflow:visible}#graph{max-width:100%;height:auto}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">COFA · ARCHITECTURE TOUR</div><h1 id="title"></h1><p id="scope"></p><p id="snapshot" class="meta"></p></header>
<div class="notice">계획·코드 확인·실행 검증은 서로 다릅니다. 이 페이지는 모델 JSON을 표시하며 실제 코드 분석·Docker 실행을 대신하지 않습니다.</div>
<div id="legend" class="legend" aria-label="검증 상태 범례"></div>
<nav id="tabs" aria-label="다이어그램 선택"></nav>
<div class="layout">
<section class="panel" aria-labelledby="diagram-title"><h2 id="diagram-title"></h2><p id="diagram-description" class="muted"></p><div class="graph-scroll" role="region" aria-label="다이어그램, 넓은 그림은 가로로 스크롤" tabindex="0"><svg id="graph" role="group" aria-label="구성요소를 선택해 상세 내용 보기"></svg></div><div class="controls"><button id="prev" type="button">이전 구성요소</button><span id="step" class="meta"></span><button id="next" type="button">다음 구성요소</button></div></section>
<aside id="detail" class="panel" aria-label="선택한 구성요소 상세"></aside>
</div>
<div class="stack"><section class="panel" id="docker-section"><h2>Docker 구성과 검증 수준</h2><div id="docker"></div></section><section class="panel" id="decisions-section"><h2>설계 선택과 대안</h2><div id="decisions"></div></section><section class="panel" id="questions-section"><h2>직접 설명해 볼 질문</h2><ol id="questions"></ol><p class="meta">AI가 허용된 단계에서 연습합니다. 문서 열람 가능 여부와 실제 서술형 규칙은 별도입니다.</p></section></div>
<footer>외부 CDN·폰트·API 호출 없이 작동하는 독립 HTML · 원본 코드나 컨테이너의 실행 성공을 보장하지 않습니다.</footer>
</main>
<script id="model" type="application/json">__MODEL_JSON__</script>
<script>
'use strict';
const model=JSON.parse(document.getElementById('model').textContent);
const labels={planned:'계획',implemented:'코드 확인',verified:'실행 검증',unknown:'미확인'};
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const svg=(tag,attrs={},text)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));if(text!==undefined)e.textContent=text;return e};
const badge=status=>el('span',labels[status],'badge '+status);
function list(parent,title,items,cls){const s=el('section',undefined,'detail-section');s.append(el('h3',title));if(items&&items.length){const ul=el('ul');items.forEach(t=>ul.append(el('li',t,cls)));s.append(ul)}else{s.append(el('p','기록 없음','meta'))}parent.append(s)}
function refs(parent,item){list(parent,'코드·문서 근거',item.sources,'source');list(parent,'실행 증거',item.evidence,'source')}
$('title').textContent=model.title;$('scope').textContent=model.scope;$('snapshot').textContent='기준 시점: '+model.snapshot;
Object.keys(labels).forEach(status=>$('legend').append(badge(status)));
let current=0,selected=0;
function detail(){const d=model.diagrams[current],n=d.nodes[selected],box=$('detail');box.replaceChildren(el('h2',n.label),badge(n.status),el('p',n.summary));list(box,'입력',n.inputs);list(box,'출력',n.outputs);list(box,'판단·검증 조건',n.conditions);list(box,'실패와 예외',n.failures);refs(box,n);const links=d.edges.filter(e=>e.from===n.id||e.to===n.id);if(links.length){const section=el('section',undefined,'detail-section');section.append(el('h3','연결 관계와 근거'));links.forEach(e=>{const card=el('details',undefined,'edge-detail');card.append(el('summary',d.nodes.find(x=>x.id===e.from).label+' → '+d.nodes.find(x=>x.id===e.to).label));card.append(badge(e.status),el('p',e.label));refs(card,e);section.append(card)});box.append(section)}$('step').textContent=(selected+1)+' / '+d.nodes.length;$('prev').disabled=selected===0;$('next').disabled=selected===d.nodes.length-1}
function draw(){const d=model.diagrams[current],g=$('graph');g.replaceChildren();const positions=new Map(d.nodes.map(n=>[n.id,{x:30+n.column*320,y:35+n.row*150}]));const width=Math.max(...d.nodes.map(n=>n.column))*320+290,height=Math.max(...d.nodes.map(n=>n.row))*150+140;g.setAttribute('viewBox',`0 0 ${width} ${height}`);g.setAttribute('width',width);g.setAttribute('height',height);const defs=svg('defs'),marker=svg('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(svg('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#738991'}));defs.append(marker);g.append(defs);
d.edges.forEach(e=>{const a=positions.get(e.from),b=positions.get(e.to);let x1,y1,x2,y2,path,lx,ly;if(a.x===b.x){x1=a.x+110;y1=a.y+(b.y>a.y?80:0);x2=b.x+110;y2=b.y+(b.y>a.y?0:80);path=`M ${x1} ${y1} L ${x2} ${y2}`;lx=x1+8;ly=(y1+y2)/2}else{x1=a.x+(b.x>a.x?220:0);y1=a.y+40;x2=b.x+(b.x>a.x?0:220);y2=b.y+40;const mid=(x1+x2)/2;path=`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;lx=mid-22;ly=(y1+y2)/2-10}const p=svg('path',{d:path,class:'edge','marker-end':'url(#arrow)'});if(e.status==='planned'||e.status==='unknown')p.setAttribute('stroke-dasharray','6 4');const title=svg('title',{},e.label+' / '+labels[e.status]);p.append(title);g.append(p);const label=svg('text',{x:lx,y:ly,class:'edge-label'},e.label.length>11?e.label.slice(0,10)+'…':e.label);label.append(svg('title',{},e.label));g.append(label)});
d.nodes.forEach((n,i)=>{const p=positions.get(n.id),node=svg('g',{transform:`translate(${p.x},${p.y})`,class:'node'+(i===selected?' selected':''),role:'button',tabindex:0,'aria-label':n.label+' / '+labels[n.status],'aria-pressed':i===selected});node.append(svg('rect',{width:220,height:80,rx:10}));node.append(svg('text',{x:14,y:28},n.label.length>18?n.label.slice(0,17)+'…':n.label));node.append(svg('text',{x:14,y:53,class:'sub'},labels[n.status]+' · '+(n.sources||[]).length+'개 근거'));node.append(svg('title',{},n.label+' — '+n.summary));const select=()=>{selected=i;draw();detail()};node.addEventListener('click',select);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=i;draw();detail();g.querySelectorAll('.node')[i].focus()}});g.append(node)})}
function show(i){current=i;selected=0;const d=model.diagrams[i];$('diagram-title').textContent=d.title;$('diagram-description').textContent=d.description;Array.from($('tabs').children).forEach((b,j)=>b.setAttribute('aria-pressed',j===i));draw();detail()}
model.diagrams.forEach((d,i)=>{const b=el('button',d.title);b.type='button';b.addEventListener('click',()=>show(i));$('tabs').append(b)});
$('prev').addEventListener('click',()=>{if(selected>0){selected--;draw();detail()}});$('next').addEventListener('click',()=>{if(selected<model.diagrams[current].nodes.length-1){selected++;draw();detail()}});
function extras(key){const items=model[key]||[];if(!items.length){$(key+'-section').hidden=true;return}items.forEach(item=>{const card=el('article',undefined,key==='docker'?'check':'decision');if(key==='docker'){card.append(el('h3',item.item),badge(item.status),el('p',item.detail));refs(card,item)}else{card.append(el('h3',item.choice),el('p',item.reason),el('p','대안·포기한 점: '+item.alternatives));list(card,'선택 근거',item.evidence,'source')}$(key).append(card)})}
extras('docker');extras('decisions');if(!(model.questions||[]).length)$('questions-section').hidden=true;(model.questions||[]).forEach(q=>$('questions').append(el('li',q)));show(0);
</script>
</body>
</html>
